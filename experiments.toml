# ─────────────────────────────────────────────────────────────────────────────
# 실험별 피크 비교: 결정화 분율 X (정규화 면적) vs 온도, 범례에 T50
#
#   uv run python main.py compare                 ← 이 파일 사용
#   uv run python main.py compare 다른파일.toml
#   uv run python main.py overview x1             ← 아래 [[exp]] 이름으로 그 실험 한 장 요약
#
# 결과: out/compare/<파일이름>.png / .html / _T50.csv / _frames.csv
#
# 경로는 자동으로 찾지 않음 → 이미지 폴더 · 온도 로그 모두 전체 경로를 그대로 적기
#   (2nd 측정, 로컬 백업, Z: 원본 등이 섞여 있어서 이름만으로 찾으면 엉뚱한 폴더를 쓸 수 있음)
#   윈도우 경로는 '작은따옴표' 로 (역슬래시 그대로 사용)
#   상대경로를 쓰면 프로젝트 폴더(D:\USER_DATA\hkim\261004) 기준
# ─────────────────────────────────────────────────────────────────────────────

# 디텍터 기하 / 빔 — 모든 명령(overview, heatmap, profile, compare ...)의 기본값
# 일회성으로 바꿀 땐 명령에 --poni X Y --sdd MM --energy KEV --alpha DEG
[geometry]
poni_px    = [514.0, 850.0]   # PONI (x, y) [px]
sdd_mm     = 861.14           # 시료 → PONI 거리 [mm]
energy_kev = 13.0             # X-선 에너지 [keV]
alpha_deg  = 18.9             # 디텍터 암 2θ 모터 값 [deg]  ← 실험 로그 값으로!
pixel_um   = 75.0             # 픽셀 크기 [µm] (Eiger2 1M)

# 경로를 생략한 명령(timing, center, profile, heatmap)의 기본 폴더 / 파일
[paths]
default_folder = 'Z:\exp\hkim\261004\images\testx1'
default_file   = 'Z:\exp\hkim\261004\images\testx1\testx1_00089.h5'

[options]
segment = "heat"        # "heat" = 승온 구간만 사용, "all" = 전체
level   = 0.5           # T50 기준: X 가 이 값을 처음 넘는 온도
n_norm  = 10            # X 정규화: 처음 n 프레임 = 0, 마지막 n 프레임 = 1
t_range = [250, 520]    # 사용할 온도 범위 [°C] (지우면 전체)
tth_bin = 0.02          # 2θ 빈 [deg]
search  = 0.5           # 아래 참고 2θ ± search 안에서 실제 피크를 찾음 [deg]
fwhm_k  = 1.5           # 적분 창 = 찾은 중심 ± fwhm_k × 반치폭(FWHM)  (실험·피크마다 자동)

# 피크 이름 = 참고 2θ (대략 이 근처라는 뜻. 실제 중심·반치폭은 실험마다 결정화 끝난 상태에서 찾음)
# 13 keV, In2O3 (a = 10.117 Å): (222) ≈ 18.79° (아래 픽), (400) ≈ 21.74° (위 픽)
[peaks]
"(222)" = 18.9
"(400)" = 21.8

# 실험 하나당 [[exp]] 하나. images / recipe 는 여러 개 가능 (시간순으로 합침)
# start / end (선택): 이 시각 사이 프레임만 사용. "2026-10-05 03:30" 또는 "03:30"
# color (선택): 선 색 "#d62728" (생략하면 순서대로 빨강 · 파랑 · 초록 · 보라 ...)

[[exp]]
name   = "x1"
images = ['D:\USER_DATA\hkim\261004\data\IGOx1']                                  # 18:22~19:46
recipe = ['D:\USER_DATA\hkim\261004\data\temperature\recipe_data_20261004_x1.csv'] # 18:07~19:45

[[exp]]
name   = "x2"
images = ['D:\USER_DATA\hkim\261004\data\IGOx2']                                  # 20:29~21:54
recipe = ['D:\USER_DATA\hkim\261004\data\temperature\recipe_data_20261004_x2.csv'] # 20:10~21:49

[[exp]]
name   = "x4"
images = ['Z:\exp\hkim\261004\images\IGOx4']        # 03:50~05:06 (03:14~03:18 이전 측정 일부 섞임)
recipe = ['D:\USER_DATA\hkim\261004\data\temperature\261004_9C_IGO_x4_2nd\recipe_data_20261005_032752.csv']

[[exp]]
name   = "x8"
images = ['D:\USER_DATA\hkim\261004\data\IGOx8']    # 로컬 백업 (05:36~06:59, 정상 x8). Z:\...\IGOx8 은 다른 데이터
recipe = ['D:\USER_DATA\hkim\261004\data\temperature\261004_9C_IGO_x8_2nd\recipe_data_20261005_051334.csv']
